<table class="velox-table" *ngIf="clientes.length">
  <thead>
  <tr>
    <th>ID</th>
    <th>Documento</th>
    <th>Nombre</th>
    <th>Teléfono</th>
    <th>Acciones</th>
  </tr>
  </thead>
  <tbody>
  <tr *ngFor="let c of clientes">
    <td><span class="id-badge">{{ c.clienteId }}</span></td>
    <td>{{ c.documento }}</td>
    <td>{{ c.nombre }}</td>
    <td>{{ c.telefono }}</td>
    <td class="acciones">
      <button class="btn-edit" (click)="onEditar.emit(c)">Editar</button>
      <button class="btn-delete" (click)="onEliminar.emit(c.clienteId!)">Eliminar</button>
    </td>
  </tr>
  </tbody>
</table>
<div class="empty-state" *ngIf="!clientes.length">No hay clientes registrados</div>
