<div class="contenedor">

  <h1>Gestión de Clientes</h1>

  <div class="formulario">

    <h2>Registrar Cliente</h2>

    <input
      type="text"
      placeholder="Documento"
      [(ngModel)]="nuevoCliente.documento"
    />

    <input
      type="text"
      placeholder="Nombre"
      [(ngModel)]="nuevoCliente.nombre"
    />

    <input
      type="text"
      placeholder="Teléfono"
      [(ngModel)]="nuevoCliente.telefono"
    />

    <button
      (click)="registrarCliente()"
      [disabled]="!nuevoCliente.documento || !nuevoCliente.nombre || !nuevoCliente.telefono"
    >
      Registrar Cliente
    </button>

    <p class="mensaje">{{mensaje}}</p>

  </div>

  <hr>

  <div class="tabla">

    <h2>Lista de Clientes</h2>

    <table>

      <thead>
      <tr>
        <th>ID</th>
        <th>Documento</th>
        <th>Nombre</th>
        <th>Teléfono</th>
      </tr>
      </thead>

      <tbody>
      <tr *ngFor="let c of clientes">
        <td>{{c.clienteId}}</td>
        <td>{{c.documento}}</td>
        <td>{{c.nombre}}</td>
        <td>{{c.telefono}}</td>
      </tr>
      </tbody>

    </table>

  </div>

</div>
