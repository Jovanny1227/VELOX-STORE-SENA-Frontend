<div class="clientes-container">
  <div class="section-header"><h2>Registro de Clientes</h2></div>

  <app-cliente-form
    [clienteEditando]="clienteEditando"
    [mensaje]="mensaje"
    [mensajeError]="mensajeError"
    (onRegistrar)="registrarCliente($event)"
    (onGuardarEdicion)="actualizarCliente($event)"
    (onCancelarEdicion)="clienteEditando = null">
  </app-cliente-form>

  <div class="section-header" style="margin-top:32px">
    <h2>Lista de Clientes</h2>
    <span class="badge-count">{{ clientes.length }}</span>
  </div>

  <app-cliente-list
    [clientes]="clientes"
    (onEditar)="clienteEditando = $event"
    (onEliminar)="eliminarCliente($event)">
  </app-cliente-list>
</div>
