<div style="padding:40px"><div class="ventas-wrapper">

  <h2>Registrar Venta</h2>

  <!-- Loading -->
  <div *ngIf="cargando" class="msg msg-loading">
    <span class="pulse-dot"></span>
    Procesando venta......
  </div>

  <!-- Éxito -->
  <div *ngIf="mensajeExito" class="msg msg-success">
    {{ mensajeExito }}
  </div>

  <!-- Error -->
  <div *ngIf="mensajeError" class="msg msg-error">
    {{ mensajeError }}
  </div>

  <!-- Cliente -->
  <div class="field-group">
    <label for="cliente">Cliente</label>
    <select id="cliente" [(ngModel)]="clienteSeleccionado">
      <option [ngValue]="null">-- Seleccionar Cliente --</option>
      <option *ngFor="let c of clientes" [ngValue]="c.clienteId">
        {{ c.nombre }} ({{ c.documento }})
      </option>
    </select>
  </div>

  <!-- Bicicleta -->
  <div class="field-group">
    <label for="bicicleta">Bicicleta</label>
    <select id="bicicleta" [(ngModel)]="bicicletaSeleccionada">
      <option value="">-- Seleccionar Bicicleta --</option>
      <option *ngFor="let b of bicicletas" [value]="b.codigo">
        {{ b.marca }} {{ b.modelo }} ({{ b.tipo }}) — {{ b.precio | currency:'COP':'symbol':'1.0-0' }}
      </option>
    </select>
  </div>

  <!-- Cantidad -->
  <div class="field-group">
    <label for="cantidad">Cantidad</label>
    <input
      id="cantidad"
      type="number"
      [(ngModel)]="cantidad"
      min="1"
    />
  </div>

  <!-- Botón -->
  <button
    class="btn-registrar"
    (click)="registrarVenta()"
    [disabled]="cargando"
  >
    Registrar Venta
  </button>

</div></div>
