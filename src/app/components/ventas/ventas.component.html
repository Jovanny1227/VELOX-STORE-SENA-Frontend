<div style="padding:40px">

  <h2>Registrar Venta</h2>

  <div *ngIf="cargando">Procesando venta...</div>
  <div *ngIf="mensajeExito" style="color:green">{{ mensajeExito }}</div>
  <div *ngIf="mensajeError" style="color:red">{{ mensajeError }}</div>

  <div style="margin-top:20px">
    <label>Cliente:</label>
    <select [(ngModel)]="clienteSeleccionado">
      <option [ngValue]="null">-- Seleccionar Cliente --</option>
      <option *ngFor="let c of clientes" [ngValue]="c.clienteId">
        {{ c.nombre }} ({{ c.documento }})
      </option>
    </select>
  </div>

  <div style="margin-top:10px">
    <label>Bicicleta:</label>
    <select [(ngModel)]="bicicletaSeleccionada">
      <option value="">-- Seleccionar Bicicleta --</option>
      <option *ngFor="let b of bicicletas" [value]="b.codigo">
        {{ b.marca }} {{ b.modelo }} ({{ b.tipo }}) - {{ b.precio | currency:'COP':'symbol':'1.0-0' }}
      </option>
    </select>
  </div>

  <div style="margin-top:10px">
    <label>Cantidad:</label>
    <input type="number" [(ngModel)]="cantidad" min="1" />
  </div>

  <button (click)="registrarVenta()" style="margin-top:20px">
    Registrar Venta
  </button>

</div>
