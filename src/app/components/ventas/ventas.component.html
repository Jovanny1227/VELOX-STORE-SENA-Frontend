<div class="ventas-container">
  <div class="section-header"><h2>Registrar Venta</h2></div>

  <app-venta-form
    [clientes]="clientes"
    [bicicletas]="bicicletas"
    [cargando]="cargando"
    [mensajeExito]="mensajeExito"
    [mensajeError]="mensajeError"
    (onRegistrarVenta)="procesarVenta($event)">
  </app-venta-form>

  <div class="section-header" style="margin-top:32px">
    <h2>Historial de Ventas</h2>
    <span class="badge-count">{{ ventas.length }}</span>
  </div>

  <app-venta-list
    [ventas]="ventas"
    (onEliminar)="eliminarVenta($event)">
  </app-venta-list>
</div>
