<div class="form-card">
  <div class="form-grid">
    <div class="field-group">
      <label>Cliente</label>
      <select class="velox-input" [(ngModel)]="clienteSeleccionado">
        <option [ngValue]="null">-- Seleccionar Cliente --</option>
        <option *ngFor="let c of clientes" [ngValue]="c.clienteId">{{ c.nombre }} ({{ c.documento }})</option>
      </select>
    </div>
    <div class="field-group">
      <label>Bicicleta</label>
      <select class="velox-input" [(ngModel)]="bicicletaSeleccionada">
        <option value="">-- Seleccionar Bicicleta --</option>
        <option *ngFor="let b of bicicletas" [value]="b.codigo">
          {{ b.marca }} {{ b.modelo }} - {{ b.precio | currency:'COP':'symbol':'1.0-0' }}
        </option>
      </select>
    </div>
    <div class="field-group">
      <label>Cantidad</label>
      <input type="number" class="velox-input" [(ngModel)]="cantidad" min="1" />
    </div>
  </div>
  <button class="btn-primary" (click)="enviar()"
          [disabled]="!clienteSeleccionado || !bicicletaSeleccionada || cantidad < 1 || cargando">
    {{ cargando ? 'Procesando...' : 'Registrar Venta' }}
  </button>
  <p class="msg-exito" *ngIf="mensajeExito">{{ mensajeExito }}</p>
  <p class="msg-error" *ngIf="mensajeError">{{ mensajeError }}</p>
</div>
