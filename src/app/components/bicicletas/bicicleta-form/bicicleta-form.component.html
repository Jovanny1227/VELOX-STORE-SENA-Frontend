<div class="velox-card">
  <div class="card-header-neon">REGISTRAR BICICLETA</div>
  <div class="card-body">
    <div class="field-group">
      <label class="field-label">Marca</label>
      <input class="velox-input" placeholder="Ej: Trek" [(ngModel)]="nuevaBicicleta.marca">
    </div>
    <div class="field-group">
      <label class="field-label">Modelo</label>
      <input class="velox-input" placeholder="Ej: Marlin 5" [(ngModel)]="nuevaBicicleta.modelo">
    </div>
    <div class="field-group">
      <label class="field-label">Tipo</label>
      <select class="velox-select" [(ngModel)]="nuevaBicicleta.tipo">
        <option value="" disabled>Seleccione tipo</option>
        <option value="MTB">MTB</option>
        <option value="RUTA">Ruta</option>
        <option value="URBANO">Urbano</option>
        <option value="BMX">BMX</option>
      </select>
    </div>
    <div class="field-group">
      <label class="field-label">Proveedor</label>
      <select class="velox-select" [(ngModel)]="proveedorSeleccionado">
        <option [ngValue]="null" disabled>Seleccione proveedor</option>
        <option *ngFor="let p of proveedores" [ngValue]="p.idProveedor">{{ p.nombre }}</option>
      </select>
      <small class="field-hint" *ngIf="proveedores.length === 0">No hay proveedores registrados</small>
    </div>
    <div class="field-row">
      <div class="field-group">
        <label class="field-label">Precio unit.</label>
        <input type="number" class="velox-input" [(ngModel)]="nuevaBicicleta.precio">
      </div>
      <div class="field-group">
        <label class="field-label">Stock</label>
        <input type="number" class="velox-input" [(ngModel)]="stockInicial">
      </div>
    </div>
    <div class="valor-preview" *ngIf="nuevaBicicleta.precio > 0 && stockInicial > 0">
      <span class="valor-label">Valor total entrada</span>
      <span class="valor-num">{{ nuevaBicicleta.precio * stockInicial | currency:'COP':'symbol':'1.0-0' }}</span>
    </div>
    <p class="msg-exito" *ngIf="mensaje">{{ mensaje }}</p>
    <p class="msg-error" *ngIf="mensajeError">{{ mensajeError }}</p>
    <button class="velox-btn-primary" (click)="emitirRegistro()">GUARDAR</button>
  </div>
</div>
