<table class="velox-table">
  <thead>
  <tr>
    <th>BICICLETA</th>
    <th>EXISTENCIAS</th>
    <th>UBICACIÓN</th>
  </tr>
  </thead>
  <tbody>
  <tr *ngFor="let item of inventario">
    <td>
      <strong>{{ item.marca || item.bicicleta?.marca || 'Bicicleta' }}</strong>
      {{ item.modelo || item.bicicleta?.modelo || item.codigo || item.id_bicicleta }}
    </td>
    <td class="existencias-cell">
      {{ item.stock ?? item.cantidadDisponible ?? item.cantidad_disponible ?? '0' }}
    </td>
    <td>{{ item.ubicacion || 'Bodega Principal' }}</td>
  </tr>
  </tbody>
</table>
