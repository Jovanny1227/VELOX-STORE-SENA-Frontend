<div class="login-wrapper">

  <div class="login-glass-card">
    <div class="login-header">
      <h2>Crear Cuenta</h2>
      <p>Únete a VELOX STORE y accede al mejor catálogo</p>
    </div>

    <div class="alert alert-success text-center p-2 mb-3 fw-bold" style="background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid #34d399;" *ngIf="mensajeExito">
      {{ mensajeExito }}
    </div>

    <form [formGroup]="registroForm" (ngSubmit)="onSubmit()" *ngIf="!mensajeExito">

      <div class="form-group mb-3">
        <label class="form-label">Nombre Completo</label>
        <input type="text" class="form-control custom-input" formControlName="nombre" placeholder="Ej. Juan Pérez">
      </div>

      <div class="form-group mb-3">
        <label class="form-label">Correo Electrónico</label>
        <input type="email" class="form-control custom-input" formControlName="email" placeholder="juan1@gmail.com">
      </div>

      <div class="form-group mb-4">
        <label class="form-label">Contraseña</label>
        <input type="password" class="form-control custom-input" formControlName="password" placeholder="Mínimo 6 caracteres">
      </div>

      <div class="alert custom-alert p-2 text-center" *ngIf="error">
        {{ error }}
      </div>

      <button type="submit" class="btn btn-login w-100 py-3" [disabled]="registroForm.invalid || cargando">
        {{ cargando ? 'Creando cuenta...' : 'Registrarme' }}
      </button>
    </form>

    <div class="text-center mt-4 pt-3 border-top" style="border-color: rgba(255,255,255,0.2) !important;">
      <p style="color: #e2e8f0; font-size: 0.95rem; display: inline-block; margin-right: 8px;">¿Ya tienes una cuenta?</p>
      <a routerLink="/login" class="back-link fw-bold" style="color: #60a5fa;">Inicia sesión</a>
    </div>
  </div>
</div>
